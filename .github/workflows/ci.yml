name: AxiomCode CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies without desktop postinstall
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check backend/services/extensionService.js
          node --check extensions/intellicode/runtime.js
          node --check src/renderer.js
          node --check marketplace-server/server.js
      - name: Unit tests
        run: npm test

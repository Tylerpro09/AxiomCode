name: Publish AxiomCode Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-local-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify installer
        env:
          DOWNLOAD_URL: https://now-drums-major-navigation.trycloudflare.com/AxiomCode%20Setup%200.1.0.exe
          SHA256: cb50bdd78f8b991225950ce40a0d2d46790e68fce02039e1159b043b5716ce0f
          ASSET_NAME: AxiomCode Setup 0.1.0.exe
        shell: bash
        run: |
          curl -fL --retry 8 --retry-delay 3 --connect-timeout 20 "$DOWNLOAD_URL" -o "$ASSET_NAME"
          echo "$SHA256  $ASSET_NAME" | sha256sum -c -

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
          TITLE: AxiomCode v0.1.0
          ASSET_NAME: AxiomCode Setup 0.1.0.exe
        shell: bash
        run: |
          NOTES='Primera versión instalable de AxiomCode para Windows. Incluye editor de código, terminal integrada, marketplace online de extensiones y Modo Scratch opcional.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:; img-src 'self' data: file:; font-src 'self' data: file:; worker-src 'self' blob: data:; frame-src 'self' http://127.0.0.1:*;" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AxiomCode</title>
  <link rel="stylesheet" href="../node_modules/@vscode/codicons/dist/codicon.css" />
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../extensions/scratch-mode/style.css" />
</head>
<body>
  <header class="titlebar">
    <div class="title-left"><div class="app-badge">A</div><nav class="menubar"><button data-menu="file">Archivo</button><button data-menu="edit">Editar</button><button data-menu="selection">Selección</button><button data-menu="view">Ver</button><button data-menu="go">Ir</button><button data-menu="run">Ejecutar</button><button data-menu="terminal">Terminal</button><button data-menu="help">Ayuda</button></nav></div>
    <button id="commandBtn" class="command-center"><span class="codicon codicon-search"></span><span>AxiomCode</span></button>
    <div class="title-actions"><button id="updateBtn" class="update-btn" title="Buscar actualizaciones"><span class="codicon codicon-cloud-download"></span><span id="updateBtnText">Update</span></button><button id="openBtn" title="Abrir carpeta"><span class="codicon codicon-folder-opened"></span></button><button id="saveBtn" title="Guardar"><span class="codicon codicon-save"></span></button></div>
  </header>
  <div class="workbench">
    <aside class="activity"><div class="activity-top"><button id="explorerBtn" class="active" title="Explorador"><span class="codicon codicon-files"></span></button><button id="searchBtn" title="Buscar"><span class="codicon codicon-search"></span></button><button id="gitBtn" title="Control de código fuente"><span class="codicon codicon-source-control"></span></button><button id="runBtn" title="Ejecutar y depurar"><span class="codicon codicon-debug-alt"></span></button><button id="extensionsBtn" title="Extensiones"><span class="codicon codicon-extensions"></span></button><button id="scratchBtn" style="display:none" title="Modo Scratch: programar con bloques"><span class="codicon codicon-symbol-color"></span></button><button id="terminalBtn" title="Terminal"><span class="codicon codicon-terminal"></span></button></div><div class="activity-bottom"><button id="accountsBtn" title="Cuentas"><span class="codicon codicon-account"></span></button><button id="settingsBtn" title="Administrar"><span class="codicon codicon-gear"></span></button></div></aside>
    <aside class="sidebar"><div class="side-head"><span>EXPLORADOR</span><div class="side-actions"><button id="newFileBtn" title="Nuevo archivo"><span class="codicon codicon-new-file"></span></button><button id="newFolderBtn" title="Nueva carpeta"><span class="codicon codicon-new-folder"></span></button><button id="refreshBtn" title="Actualizar"><span class="codicon codicon-refresh"></span></button><button title="Más acciones"><span class="codicon codicon-ellipsis"></span></button></div></div><div class="workspace-name"><span class="codicon codicon-chevron-down"></span><span id="workspaceName">SIN CARPETA ABIERTA</span></div><div id="tree" class="tree"><div class="empty-state">Todavía no has abierto una carpeta.<button id="welcomeOpen">Abrir carpeta</button></div></div></aside>    <main class="main"><div id="tabs" class="tabs"><div class="welcome-tab">Inicio</div></div><div class="editor-stage"><div class="breadcrumbs"><span class="codicon codicon-folder"></span><span id="breadcrumbText">AxiomCode</span></div><div id="editor" class="editor"></div><div id="welcome" class="welcome"><div class="welcome-inner"><div class="welcome-logo">A</div><div class="welcome-copy"><h1>AxiomCode</h1><p>Edición de código. Redefinida.</p><h2>Inicio</h2><button id="welcomeCommand" class="start-link"><span class="codicon codicon-terminal"></span> Mostrar todos los comandos</button><button class="start-link" onclick="document.getElementById('openBtn').click()"><span class="codicon codicon-folder-opened"></span> Abrir carpeta...</button><div class="shortcut-hints"><span><b>Ctrl+P</b> Ir al archivo</span><span><b>Ctrl+Shift+P</b> Paleta de comandos</span><span><b>Ctrl+`</b> Terminal</span></div></div></div></div></div>
      <section id="panel" class="panel"><div class="panel-head"><div class="panel-title-strip"><button id="problemsTab">PROBLEMAS</button><button id="outputTab">SALIDA</button><button id="debugTab">CONSOLA DE DEPURACIÓN</button><button id="terminalTab" class="panel-tab active">TERMINAL</button><div id="terminalTabs" class="terminal-tabs"></div></div><div class="terminal-actions"><select id="terminalShell"><option value="powershell">PowerShell</option><option value="cmd">Command Prompt</option></select><button id="newTerminal" title="Nueva terminal"><span class="codicon codicon-plus"></span></button><button id="killTerminal" title="Cerrar terminal"><span class="codicon codicon-trash"></span></button><button id="closePanel" title="Ocultar panel"><span class="codicon codicon-chevron-down"></span></button></div></div><div class="panel-body"><div id="terminalOutput" class="terminal-output"></div><div id="terminalHost" class="terminal-host"></div></div><div class="terminal-input-row"><span id="terminalPrompt" class="prompt">PS&gt;</span><input id="terminalInput" autocomplete="off" spellcheck="false" placeholder="Escribe un comando" /></div></section>
    </main>
  </div>
  <footer class="statusbar"><div class="status-left"><span class="status-remote"><span class="codicon codicon-remote"></span></span><span id="gitStatus"><span class="codicon codicon-source-control"></span> main</span><span><span class="codicon codicon-sync"></span></span><span id="statusMessage">Listo</span></div><div class="status-right"><span id="cursorPos">Ln 1, Col 1</span><span>Espacios: 4</span><span>UTF-8</span><span>CRLF</span><span id="language">Texto</span><span class="codicon codicon-bell"></span></div></footer>
  <div id="overlay" class="overlay hidden"><div class="palette"><div class="palette-search"><span class="codicon codicon-search"></span><input id="paletteInput" placeholder="Escribe un comando o archivo..." autocomplete="off" /></div><div id="paletteResults" class="palette-results"></div></div></div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="../extensions/scratch-mode/core.js"></script>
  <script src="../extensions/scratch-mode/view.js"></script>
  <script src="../extensions/scratch-mode/official-view.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
